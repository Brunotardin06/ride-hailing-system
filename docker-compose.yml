# Local development environment for the Distributed Ride-Hailing System.
#
#   Infrastructure only:  docker compose up -d postgres rabbitmq kafka
#   Everything:           docker compose up -d --build
#
# Values come from .env (see .env.example); defaults below are used when .env is missing.
# Containers talk to each other by service name (postgres, rabbitmq, kafka, driver-service, ...).

name: ride-hailing

# Settings shared by the backend services (merged in with "<<: *service-env").
x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: ${RABBITMQ_USER:-ridehailing}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:-ridehailing}
  Metrics__AnalyticsUrl: http://analytics-service:8080

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridehailing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridehailing}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ridehailing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ridehailing}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"               # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners: kafka:19092 for containers, localhost:9092 for services run on the host.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------- Backend services ----------
  # Build context is the repository root (the services share src/shared). Containers listen on 8080;
  # the host ports below are the same as for local "dotnet run", so the frontend works with both.
  # Inside the network services reach each other by name, e.g. http://driver-service:8080.

  ride-service:
    build: { context: ., dockerfile: src/services/RideService/Dockerfile }
    restart: on-failure
    environment:
      <<: *service-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rides;Username=${POSTGRES_USER:-ridehailing};Password=${POSTGRES_PASSWORD:-ridehailing}
      Kafka__BootstrapServers: kafka:19092
      ServiceUrls__MatchingService: http://matching-service:8080
      ServiceUrls__MatchingExperiment: http://matching-experiment:8080
      Matching__Mode: ${RIDE_MATCHING_MODE:-RabbitMq}   # RabbitMq (async) or Rest (sync) for normal rides
    ports:
      - "${RIDE_SERVICE_PORT:-5001}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_healthy }

  driver-service:
    build: { context: ., dockerfile: src/services/DriverService/Dockerfile }
    restart: on-failure
    environment:
      <<: *service-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=drivers;Username=${POSTGRES_USER:-ridehailing};Password=${POSTGRES_PASSWORD:-ridehailing}
      Kestrel__Endpoints__Http__Url: http://+:8080   # REST (HTTP/1.1)
      Kestrel__Endpoints__Grpc__Url: http://+:8081   # gRPC (HTTP/2)
      Offers__TimeoutSeconds: ${OFFER_TIMEOUT_SECONDS:-30}
    ports:
      - "${DRIVER_SERVICE_PORT:-5002}:8080"
      - "${DRIVER_SERVICE_GRPC_PORT:-5012}:8081"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  matching-service:
    build: { context: ., dockerfile: src/services/MatchingService/Dockerfile }
    restart: on-failure
    environment:
      <<: *service-env
      ServiceUrls__DriverService: http://driver-service:8080
      ServiceUrls__DriverServiceGrpc: http://driver-service:8081
      DriverLookup__Mode: ${DRIVER_LOOKUP_MODE:-Rest}   # Rest or Grpc
    ports:
      - "${MATCHING_SERVICE_PORT:-5003}:8080"
    depends_on:
      rabbitmq: { condition: service_healthy }
      driver-service: { condition: service_started }

  # Dedicated MatchingService instance for Experiment A (same image/code, Matching__Instance=Experiment).
  # It only handles experiment rides (queue matching-experiment, experiment driver pool), so it can be made
  # unavailable, or really stopped with "docker compose stop matching-experiment", without affecting demo rides.
  matching-experiment:
    build: { context: ., dockerfile: src/services/MatchingService/Dockerfile }
    restart: on-failure
    environment:
      <<: *service-env
      Matching__Instance: Experiment
      # One message in flight at a time: waiting work stays visible as "ready" messages in the queue.
      RabbitMQ__PrefetchCount: 1
      ServiceUrls__DriverService: http://driver-service:8080
      ServiceUrls__DriverServiceGrpc: http://driver-service:8081
    ports:
      - "${MATCHING_EXPERIMENT_PORT:-5013}:8080"
    depends_on:
      rabbitmq: { condition: service_healthy }
      driver-service: { condition: service_started }

  realtime-service:
    build: { context: ., dockerfile: src/services/RealtimeService/Dockerfile }
    restart: on-failure
    environment:
      <<: *service-env
    ports:
      - "${REALTIME_SERVICE_PORT:-5004}:8080"
    depends_on:
      rabbitmq: { condition: service_healthy }

  analytics-service:
    build: { context: ., dockerfile: src/services/AnalyticsService/Dockerfile }
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=analytics;Username=${POSTGRES_USER:-ridehailing};Password=${POSTGRES_PASSWORD:-ridehailing}
      Kafka__BootstrapServers: kafka:19092
      # Experiment runners (A and B)
      ServiceUrls__RideService: http://ride-service:8080
      ServiceUrls__DriverService: http://driver-service:8080
      ServiceUrls__MatchingExperiment: http://matching-experiment:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-ridehailing}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-ridehailing}
      RabbitMQ__ManagementUrl: http://rabbitmq:15672
    ports:
      - "${ANALYTICS_SERVICE_PORT:-5005}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
