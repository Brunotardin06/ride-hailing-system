# Ride-Hailing System (v2): infrastructure + the 4 backend services.
#   Start everything:        docker compose up -d --build
#   After a code change:     docker compose up -d --build <service>   (e.g. ride-service)
#   Logs of one service:     docker compose logs -f ride-service
#   Stop:                    docker compose down        (data is kept in the volumes)
#   Reset all data:          docker compose down -v
#
# The frontend still runs on the host (npm run dev) and calls the services on localhost:5001-5004.
# Inside the Docker network, services reach each other by NAME (postgres, rabbitmq, kafka, ride-service, ...).

name: ride-hailing-v2

# Settings shared by all backend services (merged in with "<<: *service-env").
x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development       # enables /api/dev/reset and OpenAPI
  RabbitMQ__Host: rabbitmq
  Kafka__BootstrapServers: kafka:19092      # internal listener (see the kafka service)

# Start a service only when the infrastructure is healthy (not just "started").
x-infra: &infra
  postgres: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }
  kafka: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ridehailing
      POSTGRES_PASSWORD: ridehailing
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehailing"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # "-management" = includes the web UI at http://localhost:15672 (login ridehailing / ridehailing)
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ridehailing
      RABBITMQ_DEFAULT_PASS: ridehailing
    ports:
      - "5672:5672"     # AMQP: the services connect here
      - "15672:15672"   # management UI (browser)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq   # durable queues + persistent messages survive a restart
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    # Single Kafka broker in KRaft mode (no ZooKeeper): it is its own controller.
    # Two listeners: localhost:9092 for services run on the host, kafka:19092 for future containers.
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1          # one broker → no replicas
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------- Backend services ----------
  # Build context = repository root, because every service also needs src/shared.
  # appsettings.json is written for "localhost" (running on the host); the environment variables below
  # override it for the container: "Section__Key" = Section:Key. Kestrel listens on 0.0.0.0 ("+") inside the
  # container (localhost would only be reachable from inside the container itself).

  ride-service:
    build: { context: ., dockerfile: src/services/RideService/Dockerfile }
    environment:
      <<: *service-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rides;Username=ridehailing;Password=ridehailing
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
    ports:
      - "5001:8080"   # REST for the frontend
      - "5011:8081"   # gRPC (only DriverService uses it; published for debugging)
    depends_on: *infra

  driver-service:
    build: { context: ., dockerfile: src/services/DriverService/Dockerfile }
    environment:
      <<: *service-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=drivers;Username=ridehailing;Password=ridehailing
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      ServiceUrls__RideServiceGrpc: http://ride-service:8081
    ports:
      - "5002:8080"
      - "5012:8081"
    depends_on: *infra

  matching-service:
    build: { context: ., dockerfile: src/services/MatchingService/Dockerfile }
    environment:
      <<: *service-env
      Kestrel__Endpoints__Http__Url: http://+:8080
      ServiceUrls__DriverServiceGrpc: http://driver-service:8081
    ports:
      - "5003:8080"
    depends_on: *infra

  realtime-service:
    build: { context: ., dockerfile: src/services/RealtimeService/Dockerfile }
    environment:
      <<: *service-env
      Kestrel__Endpoints__Http__Url: http://+:8080
    ports:
      - "5004:8080"   # SignalR hub for the frontend
    depends_on: *infra

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
